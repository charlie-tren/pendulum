buckets:
  left:
    colour: '#2f6fb2'
    label: Left
  centre:
    colour: '#9042d4'
    label: Centre
    colour_dark: '#a86ae8'
  right:
    colour: '#c33c3c'
    label: Right
  no_reading:
    colour: '#9a9a9a'
    label: Doesn't apply
    colour_dark: '#757d88'
  unresolved:
    colour: '#dcdcdc'
    label: No data
    colour_dark: '#454b56'
sources:
  dpi:
    colour: '#5b6b7a'
    label: DPI
    note: Database of Political Institutions. Codes the chief executive's party as left, right
      or centre. Covers 1975 to 2023.
  vparty:
    colour: '#8a9a5b'
    label: V-Party
    note: V-Party, an expert survey of party positions from the V-Dem Institute. Fills country-years
      DPI leaves blank. Ends around 2019.
  carry_forward:
    colour: '#c9a227'
    label: Carry-forward
    note: V-Party's rating of a party, reapplied to later years where DPI still records that same
      party in power.
  hand:
    colour: '#b5651d'
    label: Hand-coded
    note: Coded here, with a written basis and a verification date for every row.
  wikidata:
    colour: '#6d8f9c'
    label: Wikidata
    note: Wikidata's political alignment property, joined to dated head-of-government terms. This
      is what extends the series past 2023.
  no_reading:
    colour: '#9a9a9a'
    label: Doesn't apply
    colour_dark: '#757d88'
    note: 'No left-right reading applies: an absolute monarchy, a military government, or a big-tent
      personality vehicle.'
  unresolved:
    colour: '#dcdcdc'
    label: No data
    colour_dark: '#454b56'
    note: No source places this country-year on the left-right axis.
regimes:
  closed_autocracy:
    label: Closed autocracy
    short: Closed autocracies
    note: No multiparty elections for the chief executive or the legislature.
    tiny: Closed aut.
  electoral_autocracy:
    label: Electoral autocracy
    short: Electoral autocracies
    note: Multiparty elections are held, but they fall short of free and fair.
    tiny: Electoral aut.
  electoral_democracy:
    label: Electoral democracy
    short: Electoral democracies
    note: Meaningful, free and fair multiparty elections.
    tiny: Electoral dem.
  liberal_democracy:
    label: Liberal democracy
    short: Liberal democracies
    note: Free and fair elections, plus individual and minority rights, equality before the law
      and real checks on the executive.
    tiny: Liberal dem.
  unknown:
    label: Regime not classified
    short: Not classified
    note: V-Dem does not classify this country-year.
    tiny: Unclassified
note: 'colour is the light-theme value. colour_dark, where present, replaces it under prefers-color-scheme:
  dark.'
